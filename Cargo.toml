[workspace]
members = [
    "crates/logos-core",
    "crates/logos-cli",
    "crates/logos-fetch",
    "crates/logos-store",
    "crates/logos-store-pg",
    "crates/logos-store-aletheia",
    "crates/logos-import",
    "crates/logos-reporting",
    "crates/logos-tui",
    "crates/logos-runtime",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
nursery = "warn"
pedantic = "warn"
